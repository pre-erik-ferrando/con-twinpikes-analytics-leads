# Whitespace and syntax hooks on staged files. Generated outputs (query-bench reports) are
# gitignored, so no hook needs an `exclude` for them.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-json
    -   id: check-toml
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=10000']
