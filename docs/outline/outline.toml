# What sync.py publishes to Outline, and where. Only the files listed here are uploaded.
#
# The Lead Generator shares the client's collection with the Insight Generator (con-twinpikes-analytics),
# which owns the template pages (General, Casos de uso → Comercial, Proyectos y desarrollo…). As the
# company template says (¡Bienvenido! → Clientes - Colección Privada), this repo publishes two branches:
#   - the tool: Casos de uso → Comercial → Lead Generator, with its technical pages below it;
#   - the project: Proyectos y desarrollo → Proyecto Lead Generator, with Decisiones below it.
# The client's environment (Arquitectura técnica del entorno) is shared and not published from here.
# Ids of created pages are saved in outline_ids.json by the first real run (commit it). Titles say
# "Lead Generator" so they don't clash in search with the Insight Generator's pages.

url = "https://outline.prenomics.com"
collection = "eZ3Xv5Fqej"   # CLI - TwinPikes, shared with con-twinpikes-analytics
github = "https://github.com/Prenomics/con-twinpikes-analytics-leads"
branch = "develop"

