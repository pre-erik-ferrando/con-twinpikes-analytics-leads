# What sync.py publishes to Outline, and where. Only the files listed here are uploaded.
#
# The Lead Generator shares the client's collection with the Insight Generator (con-twinpikes-analytics),
# which owns the collection's template pages (General, Onboarding, Proyectos y desarrollo…). This repo
# owns only the "Proyecto Lead Generator" page, created under "Proyectos y desarrollo" (parent_id), and
# the pages below it. Their ids are saved in outline_ids.json by the first real run (commit it).
# Titles say "Lead Generator" so they don't clash in search with the Insight Generator's pages.

url = "https://outline.prenomics.com"
collection = "eZ3Xv5Fqej"   # CLI - TwinPikes, shared with con-twinpikes-analytics
github = "https://github.com/Prenomics/con-twinpikes-analytics-leads"
branch = "develop"

