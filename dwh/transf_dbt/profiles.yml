# Project dbt profile for ClickHouse. No credentials: export the DBT_CH_* env vars before running
# (`python leadgen.py dbt` loads .env itself).
leadgen_dwh_creds:
  target: dev
  outputs:
    dev:
      type: clickhouse
      # Only the landing database: every model declares its own +schema.
      schema: "{{ env_var('DBT_CH_SCHEMA', 'fld_landinglgn') }}"
      host: "{{ env_var('DBT_CH_HOST') }}"
      port: "{{ env_var('DBT_CH_PORT', '8123') | int }}"
      user: "{{ env_var('DBT_CH_USER', 'default') }}"
      password: "{{ env_var('DBT_CH_PASSWORD', '') }}"
      driver: http
      # No TLS on purpose: reached through an OpenVPN tunnel (as the TwinPikes project).
      secure: False
      create_schema: True
      threads: 4
      connect_timeout: "{{ env_var('DBT_CH_CONNECT_TIMEOUT', '30') | int }}"
