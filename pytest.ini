[pytest]
# The repo's whole Python suite, all of it DB-free (run it with ./run_tests.sh):
#
#   dwh/transf_py/leadgen/tests/   the engine: normalization, identity, filter, matching, scoring, prompt,
#                                  checks of the model's answer, export, and every run type end to end on
#                                  an in-memory store (fake Apify, fake websites, fake model).
#   dwh/transf_dbt/tests/nodb/     ClickHouse syntax of every model (sqlglot), refs/sources/columns.
#   docs/tests/                    relative links that resolve, no private IPs.
testpaths =
    dwh/transf_py/leadgen/tests
    dwh/transf_dbt/tests/nodb
    docs/tests
python_files = test_*.py
pythonpath =
    dwh/transf_py
    dwh/transf_dbt/tests/nodb
addopts = -q
